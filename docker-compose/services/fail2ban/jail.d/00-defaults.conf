# linuxserver/fail2ban leaves banaction unset, and fail2ban refuses to start
# with any jail enabled until something sets it. fail2ban-ui's jail.local does,
# but only once the UI has run - this keeps the jails up without it. A .conf,
# not a .local, because jail.local is parsed after jail.d/*.conf but before
# jail.d/*.local, so the UI's settings still take priority over these.
[DEFAULT]
banaction = iptables-multiport
banaction_allports = iptables-allports
